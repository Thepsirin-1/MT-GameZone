<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT GameZone - 10 อันดับเกมยอดนิยม PC & Mobile</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#090a0f;--card:#12151e;--hover:#161b26;--nav:rgba(13,16,23,.95);--neon:#00ff66;--btn-txt:#000;--glow:rgba(0,255,102,.35);--txt:#e0e6ed;--title:#fff;--mut:#8a96a3;--bd:rgba(0,255,102,.25);--in:#000}
body.light{--bg:#f2f5f9;--card:#ffffff;--hover:#e9eff5;--nav:rgba(255,255,255,.95);--neon:#00a844;--btn-txt:#fff;--glow:rgba(0,168,68,.2);--txt:#2d3748;--title:#111827;--mut:#64748b;--bd:rgba(0,168,68,.3);--in:#f8fafc}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Kanit',sans-serif;scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);padding-bottom:70px;overflow-x:hidden;transition:background .3s,color .3s}
.toast{position:fixed;top:20px;right:20px;background:var(--card);border:2px solid var(--neon);color:var(--title);padding:12px 22px;border-radius:8px;box-shadow:0 4px 15px var(--glow);z-index:9999;display:none;align-items:center;gap:10px}
header{background:var(--nav);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:1000;backdrop-filter:blur(10px)}
.nav,.container{max-width:1000px;margin:0 auto;padding:10px 20px}
.nav{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:42px;border-radius:8px;border:1px solid var(--neon);box-shadow:0 0 10px var(--glow);background:#000}
.logo-txt{font-family:'Orbitron',sans-serif;font-size:1.3rem;font-weight:900;color:var(--title)}
.logo-txt span{color:var(--neon)}
.actions{display:flex;align-items:center;gap:8px}
.btn,.btn-solid{padding:8px 13px;border-radius:6px;cursor:pointer;font-weight:600;transition:.25s;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:.88rem;border:1px solid var(--neon)}
.btn{background:transparent;color:var(--neon)}.btn:hover{background:var(--neon);color:var(--btn-txt);box-shadow:0 0 12px var(--glow)}
.btn-solid{background:var(--neon);color:var(--btn-txt)}.btn-solid:hover{box-shadow:0 0 16px var(--glow);transform:translateY(-1px)}
.hero{display:flex;justify-content:center;margin:10px 0 24px;padding:18px;background:radial-gradient(circle,rgba(0,255,102,.15),#0d1017 75%);border-radius:16px;border:1px solid var(--bd);box-shadow:0 8px 25px rgba(0,0,0,.35)}
.hero img{max-width:300px;width:100%;border-radius:14px;box-shadow:0 0 22px var(--glow);border:1px solid rgba(0,255,102,.4)}
.title{font-size:1.35rem;font-weight:700;color:var(--title);margin-bottom:14px;display:flex;align-items:center;gap:10px;border-left:4px solid var(--neon);padding-left:12px}
.search-box{position:relative;margin-bottom:14px}
.search-box i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search-in{width:100%;padding:11px 16px 11px 42px;background:var(--card);border:1px solid var(--bd);border-radius:10px;color:var(--title);font-size:.95rem;outline:none;transition:.25s}
.search-in:focus{border-color:var(--neon);box-shadow:0 0 12px var(--glow)}
.tabs{display:flex;gap:8px;margin-bottom:18px;background:var(--card);padding:6px;border-radius:12px;border:1px solid var(--bd)}
.tab-btn{flex:1;padding:10px;border:none;background:transparent;color:var(--mut);font-size:.95rem;font-weight:600;border-radius:8px;cursor:pointer;transition:.25s;display:flex;align-items:center;justify-content:center;gap:6px}
.tab-btn.active{background:var(--neon);color:var(--btn-txt);box-shadow:0 0 12px var(--glow)}
.list{display:flex;flex-direction:column;gap:10px;margin-bottom:40px}
.row{background:var(--card);border-radius:12px;padding:12px 15px;border:1px solid var(--bd);display:flex;align-items:center;gap:14px;cursor:pointer;transition:.2s}
.row:hover{transform:translateX(5px);border-color:var(--neon);background:var(--hover);box-shadow:0 4px 14px var(--glow)}
.rank{font-family:'Orbitron',sans-serif;font-size:1.15rem;font-weight:900;width:28px;text-align:center;color:var(--mut);flex-shrink:0}
.r1{color:#eab308;font-size:1.35rem}.r2{color:#94a3b8;font-size:1.3rem}.r3{color:#d97706;font-size:1.25rem}
.icon-box{width:62px;height:62px;border-radius:14px;overflow:hidden;background:#000;border:1px solid rgba(128,128,128,.2);flex-shrink:0}
.icon-box img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}
.g-title{font-size:1.05rem;font-weight:600;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-sub{font-size:.84rem;color:var(--mut);margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-stat{display:flex;gap:12px;font-size:.82rem}.star{color:#eab308;font-weight:600}
.row-acts{display:flex;align-items:center;gap:8px;flex-shrink:0}
.fav-btn{background:transparent;border:1px solid var(--bd);color:var(--mut);width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:.2s}
.fav-btn.liked{color:#ff2e63;border-color:#ff2e63;background:rgba(255,46,99,.1)}
.pill{background:rgba(0,255,102,.12);color:var(--neon);border:1px solid var(--neon);padding:7px 14px;border-radius:20px;font-size:.84rem;font-weight:600;text-decoration:none;transition:.2s;white-space:nowrap}
.row:hover .pill,.pill:hover{background:var(--neon);color:var(--btn-txt)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:2000;justify-content:center;align-items:center;backdrop-filter:blur(6px);padding:20px}
.m-box{background:var(--card);border:1px solid var(--neon);border-radius:12px;padding:24px;width:100%;max-width:460px;position:relative;box-shadow:0 0 25px var(--glow);max-height:90vh;overflow-y:auto;text-align:center}
.close{position:absolute;top:14px;right:16px;color:var(--mut);cursor:pointer;font-size:1.5rem}
.m-logo{width:100px;height:100px;border-radius:20px;object-fit:cover;border:2px solid var(--neon);margin:0 auto 12px;display:block}
.a-tabs{display:flex;gap:10px;margin-bottom:18px;border-bottom:1px solid var(--bd)}
.a-tab{padding:8px 16px;cursor:pointer;color:var(--mut);font-weight:600}.a-tab.active{color:var(--neon);border-bottom:2px solid var(--neon)}
.fg{margin-bottom:14px;text-align:left}.fg label{display:block;margin-bottom:5px;font-size:.88rem}
.fc{width:100%;padding:10px;background:var(--in);border:1px solid var(--bd);border-radius:6px;color:var(--title);font-size:.95rem}.fc:focus{outline:none;border-color:var(--neon)}
.b-nav{display:none;position:fixed;bottom:0;left:0;width:100%;background:var(--nav);border-top:1px solid var(--bd);z-index:1000;padding:8px 0;justify-content:space-around}
.b-item{color:var(--mut);text-decoration:none;display:flex;flex-direction:column;align-items:center;font-size:.75rem;gap:4px}.b-item.active{color:var(--neon)}
@media(max-width:768px){.logo-txt{font-size:1.05rem}.hide-m{display:none}.hero img{max-width:240px}.row{padding:10px;gap:10px}.icon-box{width:52px;height:52px}.pill{padding:6px 10px;font-size:.8rem}.b-nav{display:flex}}
</style>
</head>
<body>

<header>

  <div class="list" id="gameList"></div>
</div>

<div class="b-nav">

  <a href="#gameList" class="b-item" onclick="setPlat('pc')"><i class="fa-solid fa-desktop"></i>PC</a>
  <a href="#gameList" class="b-item" onclick="setPlat('fav')"><i class="fa-solid fa-heart"></i>เกมโปรด</a>

</div>

<div class="modal" id="gModal">

    <h2 id="m-title" style="color:var(--neon);margin-bottom:6px"></h2>

    </div>
  </div>
</div>

<div class="modal" id="aModal">

    <i class="fa-solid fa-xmark close" onclick="closeM('aModal')"></i>
    <div class="a-tabs">
      <div class="a-tab active" id="t-in" onclick="swAuth('login')">เข้าสู่ระบบ</div>
      <div class="a-tab" id="t-up" onclick="swAuth('reg')">สมัครสมาชิก</div>
    </div>
    <form id="f-in" onsubmit="doAuth(event,1)">
      <div class="fg"><label>อีเมล</label><input type="email" class="fc" placeholder="example@mail.com" required></div>

      <button type="submit" class="btn-solid" style="width:100%">เข้าสู่ระบบ</button>
    </form>
    <form id="f-up" style="display:none" onsubmit="doAuth(event,0)">
      <div class="fg"><label>ชื่อผู้ใช้งาน</label><input type="text" class="fc" placeholder="Gamer123" required></div>
      <div class="fg"><label>อีเมล</label><input type="email" class="fc" placeholder="example@mail.com" required></div>
      <div class="fg"><label>รหัสผ่าน</label><input type="password" class="fc" placeholder="••••••••" required></div>
      <button type="submit" class="btn-solid" style="width:100%">สมัครสมาชิก</button>
    </form>
  </div>
</div>

let cur='mob',favs=JSON.parse(localStorage.getItem('mt_fav')||'[]');
const allGames=[...data.mob.map((g,i)=>({p:'mob',r:i+1,g})),...data.pc.map((g,i)=>({p:'pc',r:i+1,g}))];

function toggleTheme(){
  const isL=document.body.classList.toggle('light');
  $('themeBtn').innerHTML=isL?'<i class="fa-solid fa-moon"></i>':'<i class="fa-solid fa-sun"></i>';
  localStorage.setItem('mt_theme',isL?'light':'dark');
}
if(localStorage.getItem('mt_theme')==='light')toggleTheme();

function setPlat(t){
  cur=t;
  ['mob','pc','fav'].forEach(k=>$('b-'+k).classList.toggle('active',t===k));
  render();
}

function toggleFav(name,e){
  if(e)e.stopPropagation();
  const idx=favs.indexOf(name);
  if(idx>-1){favs.splice(idx,1);toast('ลบออกจากเกมโปรดแล้ว')}
  else{favs.push(name);toast('บันทึกในเกมโปรดแล้ว ❤️')}
  localStorage.setItem('mt_fav',JSON.stringify(favs));
  render();
}

function render(){
  $('favCnt').innerText=favs.length;
  const kw=$('q').value.trim().toLowerCase();
  let list=cur==='fav'?allGames.filter(x=>favs.includes(x.g[0])):data[cur].map((g,i)=>({p:cur,r:i+1,g}));
  if(kw)list=list.filter(x=>x.g[0].toLowerCase().includes(kw)||x.g[1].toLowerCase().includes(kw));

  $('gameList').innerHTML=list.length?list.map(({p,r,g})=>{
    const liked=favs.includes(g[0]),badge=cur==='fav'?`(${p.toUpperCase()}) `:'';
    return `<div class="row" onclick="openG('${p}',${r-1})">
      <div class="rank ${r<=3?'r'+r:''}">${r}</div>
      <div class="icon-box"><img src="${g[4]}" alt="${g[0]}"></div>
      <div class="info">
        <div class="g-title">${badge}${g[0]}</div>
        <div class="g-sub">${g[1]}</div>
        <div class="g-stat"><span class="star">${g[2]} <i class="fa-solid fa-star"></i></span><span><i class="fa-solid fa-hard-drive"></i> ${g[3]}</span></div>
      </div>
      <div class="row-acts">
        <button class="fav-btn ${liked?'liked':''}" onclick="toggleFav('${g[0].replace(/'/g,"\\'")}',event)" title="ถูกใจ"><i class="fa-${liked?'solid':'regular'} fa-heart"></i></button>
        <a href="${g[6]}" target="_blank" class="pill" onclick="event.stopPropagation()"><i class="fa-solid fa-download"></i> ติดตั้ง</a>
      </div>
    </div>`;
  }).join(''):`<div style="text-align:center;padding:40px;color:var(--mut)">ไม่พบเกมที่ค้นหา</div>`;
}

function openG(p,i){
  const g=data[p][i],liked=favs.includes(g[0]);
  $('m-img').src=g[4];$('m-title').innerText=`#${i+1} ${g[0]}`;
  $('m-pub').innerHTML=`<i class="fa-solid fa-building"></i> ${g[1]}`;
  $('m-rat').innerHTML=`<i class="fa-solid fa-star"></i> ${g[2]}`;
  $('m-sz').innerHTML=`<i class="fa-solid fa-hard-drive"></i> ${g[3]}`;
  $('m-desc').innerText=g[5];$('m-dl').href=g[6];
  $('m-dl').innerHTML=`<i class="${g[7]}"></i> ${g[8]}`;
  const mf=$('m-fav');mf.className='btn'+(liked?' liked':'');
  mf.style.color=liked?'#ff2e63':'';mf.style.borderColor=liked?'#ff2e63':'';
  mf.onclick=()=>{toggleFav(g[0]);openG(p,i)};
  $('gModal').style.display='flex';
}

const closeM=id=>$(id).style.display='none',
openAuth=t=>{$('aModal').style.display='flex';swAuth(t)},
swAuth=t=>{
  const isIn=t==='login';
  $('t-in').classList.toggle('active',isIn);$('t-up').classList.toggle('active',!isIn);
  $('f-in').style.display=isIn?'block':'none';$('f-up').style.display=isIn?'none':'block';
},
doAuth=(e,isIn)=>{
  e.preventDefault();toast(isIn?'เข้าสู่ระบบสำเร็จ!':'สมัครสมาชิกสำเร็จ!');closeM('aModal');
  $('auth-box').innerHTML=`<span style="color:var(--neon);font-weight:700;margin-right:6px"><i class="fa-solid fa-user-check"></i> Gamer</span><button class="btn" onclick="out()"><i class="fa-solid fa-right-from-bracket"></i></button>`;
},
out=()=>{toast('ออกจากระบบแล้ว');$('auth-box').innerHTML=`<button class="btn-solid" onclick="openAuth('login')"><i class="fa-solid fa-right-to-bracket"></i> <span class="hide-m">เข้าสู่ระบบ</span></button>`},
copyLink=()=>navigator.clipboard.writeText(location.href).then(()=>toast('คัดลอกลิงก์สำเร็จ!')),
toast=m=>{$('t-msg').innerText=m;$('toast').style.display='flex';setTimeout(()=>$('toast').style.display='none',2600)};
render();
</script>
</body>
</html>
