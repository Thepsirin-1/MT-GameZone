<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MT GameZone - 10 อันดับเกมยอดนิยม PC & Mobile</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#090a0f;--card:#12151e;--hover:#161b26;--nav:rgba(13,16,23,.95);--neon:#00ff66;--btxt:#000;--glow:rgba(0,255,102,.35);--txt:#e0e6ed;--ttl:#fff;--mut:#8a96a3;--bd:rgba(0,255,102,.25);--in:#000}
body.light{--bg:#f2f5f9;--card:#fff;--hover:#e9eff5;--nav:rgba(255,255,255,.95);--neon:#00a844;--btxt:#fff;--glow:rgba(0,168,68,.2);--txt:#2d3748;--ttl:#111827;--mut:#64748b;--bd:rgba(0,168,68,.3);--in:#f8fafc}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Kanit',sans-serif;scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);padding-bottom:70px;overflow-x:hidden;transition:.3s}
.toast{position:fixed;top:20px;right:20px;background:var(--card);border:2px solid var(--neon);color:var(--ttl);padding:12px 22px;border-radius:8px;box-shadow:0 4px 15px var(--glow);z-index:9999;display:none;align-items:center;gap:10px}
header{background:var(--nav);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:1000;backdrop-filter:blur(10px)}
.nav,.container{max-width:1000px;margin:0 auto;padding:10px 20px}
.nav,.actions,.f-bar,.tabs,.row,.g-stat,.r-acts{display:flex;align-items:center}
.nav{justify-content:space-between}.actions,.f-bar,.tabs,.r-acts{gap:8px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:42px;border-radius:8px;border:1px solid var(--neon);box-shadow:0 0 10px var(--glow);background:#000}
.logo-txt{font:900 1.3rem 'Orbitron',sans-serif;color:var(--ttl)}.logo-txt span{color:var(--neon)}
.btn,.btn-s{padding:8px 13px;border-radius:6px;cursor:pointer;font:600 .88rem 'Kanit';transition:.25s;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;border:1px solid var(--neon)}
.btn{background:0;color:var(--neon)}.btn:hover,.btn-s,.tab-btn.active,.row:hover .pill,.pill:hover,.dd-opt.active{background:var(--neon);color:var(--btxt);box-shadow:0 0 12px var(--glow)}
.hero{display:flex;justify-content:center;margin:10px 0 24px;padding:18px;background:radial-gradient(circle,rgba(0,255,102,.15),#0d1017 75%);border-radius:16px;border:1px solid var(--bd);box-shadow:0 8px 25px rgba(0,0,0,.35)}
.hero img{max-width:300px;width:100%;border-radius:14px;box-shadow:0 0 22px var(--glow);border:1px solid rgba(0,255,102,.4)}
.title{font:700 1.35rem 'Kanit';color:var(--ttl);margin-bottom:14px;display:flex;align-items:center;gap:10px;border-left:4px solid var(--neon);padding-left:12px}
.f-bar{margin-bottom:14px}.s-box{position:relative;flex:1}.s-box i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mut)}
.s-in,.dd-btn,.fc{padding:11px 16px;background:var(--card);border:1px solid var(--bd);border-radius:10px;color:var(--ttl);font-size:.95rem;outline:0;transition:.25s;width:100%}
.s-in{padding-left:42px}.s-in:focus,.dd.open .dd-btn,.fc:focus{border-color:var(--neon);box-shadow:0 0 12px var(--glow)}
.dd{position:relative;min-width:195px;user-select:none}
.dd-btn{display:flex;align-items:center;gap:8px;padding:11px 16px 11px 0;cursor:pointer}
.dd-btn span{flex:1;text-align:center}.dd-btn i{color:var(--mut);font-size:.82rem;transition:.2s}
.dd.open .dd-btn i{transform:rotate(180deg);color:var(--neon)}
.dd-menu{display:none;position:absolute;top:calc(100% + 6px);left:0;width:100%;background:var(--card);border:1px solid var(--neon);border-radius:10px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.35);z-index:500}
.dd.open .dd-menu{display:block}
.dd-opt{padding:10px 12px;text-align:center;font-size:.93rem;cursor:pointer;transition:.15s}
.dd-opt:hover:not(.active){background:var(--hover);color:var(--neon)}.dd-opt.active{font-weight:600;box-shadow:none}
.tabs{margin-bottom:18px;background:var(--card);padding:6px;border-radius:12px;border:1px solid var(--bd)}
.tab-btn{flex:1;padding:10px;border:0;background:0;color:var(--mut);font:600 .95rem 'Kanit';border-radius:8px;cursor:pointer;transition:.25s;display:flex;align-items:center;justify-content:center;gap:6px}
.list{display:flex;flex-direction:column;gap:10px;margin-bottom:40px}
.row{background:var(--card);border-radius:12px;padding:12px 15px;border:1px solid var(--bd);gap:14px;cursor:pointer;transition:.2s}
.row:hover{transform:translateX(5px);border-color:var(--neon);background:var(--hover);box-shadow:0 4px 14px var(--glow)}
.rank{font:900 1.15rem 'Orbitron';width:28px;text-align:center;color:var(--mut);flex-shrink:0}
.r1{color:#eab308;font-size:1.35rem}.r2{color:#94a3b8;font-size:1.3rem}.r3{color:#d97706;font-size:1.25rem}
.icon{width:62px;height:62px;border-radius:14px;overflow:hidden;background:#000;border:1px solid rgba(128,128,128,.2);flex-shrink:0}.icon img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}.g-ttl{font:600 1.05rem 'Kanit';color:var(--ttl);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-sub{font-size:.84rem;color:var(--mut);margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-stat{gap:12px;font-size:.82rem}.star{color:#eab308;font-weight:600}
.fav{background:0;border:1px solid var(--bd);color:var(--mut);width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.fav.liked{color:#ff2e63;border-color:#ff2e63;background:rgba(255,46,99,.1)}
.pill{background:rgba(0,255,102,.12);color:var(--neon);border:1px solid var(--neon);padding:7px 14px;border-radius:20px;font:600 .84rem 'Kanit';text-decoration:none;transition:.2s;white-space:nowrap}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:2000;justify-content:center;align-items:center;backdrop-filter:blur(6px);padding:20px}
.m-box{background:var(--card);border:1px solid var(--neon);border-radius:12px;padding:24px;width:100%;max-width:460px;position:relative;box-shadow:0 0 25px var(--glow);max-height:90vh;overflow-y:auto;text-align:center}
.close{position:absolute;top:14px;right:16px;color:var(--mut);cursor:pointer;font-size:1.5rem}
.m-logo{width:100px;height:100px;border-radius:20px;object-fit:cover;border:2px solid var(--neon);margin:0 auto 12px;display:block}
.a-tabs{display:flex;gap:10px;margin-bottom:18px;border-bottom:1px solid var(--bd)}
.a-tab{padding:8px 16px;cursor:pointer;color:var(--mut);font-weight:600}.a-tab.active{color:var(--neon);border-bottom:2px solid var(--neon)}
.fg{margin-bottom:14px;text-align:left}.fg label{display:block;margin-bottom:5px;font-size:.88rem}.fc{background:var(--in);border-radius:6px}
.b-nav{display:none;position:fixed;bottom:0;left:0;width:100%;background:var(--nav);border-top:1px solid var(--bd);z-index:1000;padding:8px 0;justify-content:space-around}
.b-item{color:var(--mut);text-decoration:none;display:flex;flex-direction:column;align-items:center;font-size:.75rem;gap:4px}.b-item.active{color:var(--neon)}
@media(max-width:768px){.logo-txt{font-size:1.05rem}.hide-m{display:none}.hero img{max-width:240px}.row{padding:10px;gap:10px}.icon{width:52px;height:52px}.pill{padding:6px 10px;font-size:.8rem}.b-nav{display:flex}}
@media(max-width:600px){.f-bar{flex-direction:column}.dd{width:100%}}
</style>
</head>
<body>
<div id="toast" class="toast"><i class="fa-solid fa-circle-check" style="color:var(--neon)"></i><span id="t-msg"></span></div>
<header><div class="nav">
  <a href="#" class="logo"><img src="MT GameZone Logo.png" alt="Logo" onerror="this.style.display='none'"><div class="logo-txt">MT <span>GAMEZONE</span></div></a>
  <div class="actions">
    <button class="btn" id="themeBtn" onclick="toggleTheme()" title="สลับโหมด"><i class="fa-solid fa-sun"></i></button>
    <button class="btn" onclick="copyLink()"><i class="fa-solid fa-share-nodes"></i> <span class="hide-m">แชร์เว็บ</span></button>
    <div id="auth-box"><button class="btn-s" onclick="openAuth('login')"><i class="fa-solid fa-right-to-bracket"></i> <span class="hide-m">เข้าสู่ระบบ</span></button></div>
  </div>
</div></header>

<div class="container">
  <div class="hero"><img src="MT GameZone Logo.png" alt="MT GameZone" onerror="this.parentElement.style.display='none'"></div>
  <div class="title"><i class="fa-solid fa-trophy" style="color:var(--neon)"></i> 10 อันดับเกมยอดนิยม</div>
  <div class="f-bar">
    <div class="s-box"><i class="fa-solid fa-magnifying-glass"></i><input id="q" class="s-in" placeholder="ค้นหาชื่อเกม หรือแนวเกม (เช่น RPG, ยิง, Roblox)..." oninput="render()"></div>
    <div class="dd" id="sortDD">
      <div class="dd-btn" onclick="event.stopPropagation();this.parentElement.classList.toggle('open')"><span id="sortLbl">อันดับยอดนิยม</span><i class="fa-solid fa-chevron-down"></i></div>
      <div class="dd-menu">
        <div class="dd-opt active" onclick="setSort('rank',this)">อันดับยอดนิยม</div>
        <div class="dd-opt" onclick="setSort('rate',this)">คะแนนรีวิวสูงสุด</div>
        <div class="dd-opt" onclick="setSort('s_desc',this)">ขนาดไฟล์ : ใหญ่ &gt; เล็ก</div>
        <div class="dd-opt" onclick="setSort('s_asc',this)">ขนาดไฟล์ : เล็ก &gt; ใหญ่</div>
      </div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" id="b-mob" onclick="setPlat('mob')"><i class="fa-solid fa-mobile-screen-button"></i> Mobile</button>
    <button class="tab-btn" id="b-pc" onclick="setPlat('pc')"><i class="fa-solid fa-desktop"></i> PC</button>
    <button class="tab-btn" id="b-fav" onclick="setPlat('fav')"><i class="fa-solid fa-heart"></i> เกมโปรด (<span id="favCnt">0</span>)</button>
  </div>
  <div class="list" id="gameList"></div>
</div>

<div class="b-nav">
  <a href="#gameList" class="b-item" onclick="setPlat('mob')"><i class="fa-solid fa-mobile-screen"></i>Mobile</a>
  <a href="#gameList" class="b-item" onclick="setPlat('pc')"><i class="fa-solid fa-desktop"></i>PC</a>
  <a href="#gameList" class="b-item" onclick="setPlat('fav')"><i class="fa-solid fa-heart"></i>เกมโปรด</a>
  <a href="#" class="b-item" onclick="openAuth('login')"><i class="fa-solid fa-user"></i>บัญชี</a>
</div>

<div class="modal" id="gModal"><div class="m-box">
  <i class="fa-solid fa-xmark close" onclick="closeM('gModal')"></i>
  <img id="m-img" class="m-logo"><h2 id="m-title" style="color:var(--neon);margin-bottom:6px"></h2>
  <div style="display:flex;justify-content:center;gap:14px;font-size:.88rem;color:var(--mut);margin-bottom:14px"><span id="m-pub"></span><span id="m-rat" style="color:#eab308"></span><span id="m-sz"></span></div>
  <p id="m-desc" style="line-height:1.6;margin-bottom:18px;text-align:left"></p>
  <div style="display:flex;gap:10px"><button id="m-fav" class="btn" style="padding:10px 16px"><i class="fa-solid fa-heart"></i></button><a id="m-dl" target="_blank" class="btn-s" style="flex:1;font-size:1rem"></a></div>
</div></div>

<div class="modal" id="aModal"><div class="m-box">
  <i class="fa-solid fa-xmark close" onclick="closeM('aModal')"></i>
  <div class="a-tabs"><div class="a-tab active" id="t-in" onclick="swAuth('login')">เข้าสู่ระบบ</div><div class="a-tab" id="t-up" onclick="swAuth('reg')">สมัครสมาชิก</div></div>
  <form id="f-in" onsubmit="doAuth(event,1)">
    <div class="fg"><label>อีเมล</label><input type="email" id="in-mail" class="fc" placeholder="example@mail.com" required></div>
    <div class="fg"><label>รหัสผ่าน</label><input type="password" id="in-pass" class="fc" placeholder="••••••••" required></div>
    <button class="btn-s" style="width:100%">เข้าสู่ระบบ</button>
  </form>
  <form id="f-up" style="display:none" onsubmit="doAuth(event,0)">
    <div class="fg"><label>ชื่อผู้ใช้งาน</label><input id="up-name" class="fc" placeholder="Gamer123" required></div>
    <div class="fg"><label>อีเมล</label><input type="email" id="up-mail" class="fc" placeholder="example@mail.com" required></div>
    <div class="fg"><label>รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label><input type="password" id="up-pass" class="fc" placeholder="••••••••" minlength="6" required></div>
    <button class="btn-s" style="width:100%">สมัครสมาชิก</button>
  </form>
</div></div>

let cur='mob',sortBy='rank',curUser=null,favs=JSON.parse(localStorage.getItem('mt_fav')||'[]');
const allGames=[...data.mob.map((g,i)=>({p:'mob',idx:i,g})),...data.pc.map((g,i)=>({p:'pc',idx:i,g}))];

window.onclick=e=>{if(!e.target.closest('#sortDD'))$('sortDD').classList.remove('open')};
window.setSort=(v,el)=>{sortBy=v;$('sortLbl').innerText=el.innerText;document.querySelectorAll('.dd-opt').forEach(o=>o.classList.remove('active'));el.classList.add('active');$('sortDD').classList.remove('open');render()};
window.toggleTheme=()=>{const L=document.body.classList.toggle('light');$('themeBtn').innerHTML=`<i class="fa-solid fa-${L?'moon':'sun'}"></i>`;localStorage.setItem('mt_theme',L?'light':'dark')};
if(localStorage.getItem('mt_theme')==='light')toggleTheme();
window.setPlat=t=>{cur=t;['mob','pc','fav'].forEach(k=>$('b-'+k).classList.toggle('active',t===k));render()};

window.toggleFav=async(n,e)=>{
  if(e)e.stopPropagation();
  const i=favs.indexOf(n);i>-1?(favs.splice(i,1),toast('ลบออกจากเกมโปรดแล้ว')):(favs.push(n),toast('บันทึกในเกมโปรดแล้ว ❤️'));
  curUser?await setDoc(doc(db,"users",curUser.uid),{favs},{merge:true}).catch(console.error):localStorage.setItem('mt_fav',JSON.stringify(favs));
  render();
};

window.render=()=>{
  $('favCnt').innerText=favs.length;
  const kw=$('q').value.trim().toLowerCase();
  let list=cur==='fav'?allGames.filter(x=>favs.includes(x.g[0])):data[cur].map((g,i)=>({p:cur,idx:i,g}));
  if(kw)list=list.filter(x=>x.g[0].toLowerCase().includes(kw)||x.g[1].toLowerCase().includes(kw));
  if(sortBy==='rate')list.sort((a,b)=>b.g[2]-a.g[2]);
  else if(sortBy==='s_asc')list.sort((a,b)=>toMB(a.g[3])-toMB(b.g[3]));
  else if(sortBy==='s_desc')list.sort((a,b)=>toMB(b.g[3])-toMB(a.g[3]));

  $('gameList').innerHTML=list.length?list.map(({p,idx,g},i)=>{
    const r=i+1,lk=favs.includes(g[0]);
    return `<div class="row" onclick="openG('${p}',${idx},${r})"><div class="rank ${r<=3?'r'+r:''}">${r}</div><div class="icon"><img src="${g[4]}" alt="${g[0]}"></div><div class="info"><div class="g-ttl">${cur==='fav'?`(${p.toUpperCase()}) `:''}${g[0]}</div><div class="g-sub">${g[1]}</div><div class="g-stat"><span class="star">${g[2]} <i class="fa-solid fa-star"></i></span><span><i class="fa-solid fa-hard-drive"></i> ${g[3]}</span></div></div><div class="r-acts"><button class="fav ${lk?'liked':''}" onclick="toggleFav('${g[0].replace(/'/g,"\\'")}',event)"><i class="fa-${lk?'solid':'regular'} fa-heart"></i></button><a href="${g[6]}" target="_blank" class="pill" onclick="event.stopPropagation()"><i class="fa-solid fa-download"></i> ติดตั้ง</a></div></div>`;
  }).join(''):`<div style="text-align:center;padding:40px;color:var(--mut)">ไม่พบเกมที่ค้นหา</div>`;
};

window.openG=(p,idx,r)=>{
  const g=data[p][idx],lk=favs.includes(g[0]),mf=$('m-fav');
  $('m-img').src=g[4];$('m-title').innerText=`#${r} ${g[0]}`;
  $('m-pub').innerHTML=`<i class="fa-solid fa-building"></i> ${g[1]}`;$('m-rat').innerHTML=`<i class="fa-solid fa-star"></i> ${g[2]}`;$('m-sz').innerHTML=`<i class="fa-solid fa-hard-drive"></i> ${g[3]}`;
  $('m-desc').innerText=g[5];$('m-dl').href=g[6];$('m-dl').innerHTML=`<i class="${g[7]}"></i> ${g[8]}`;
  mf.style.color=mf.style.borderColor=lk?'#ff2e63':'';mf.onclick=()=>{toggleFav(g[0]);openG(p,idx,r)};
  $('gModal').style.display='flex';
};

window.closeM=id=>$(id).style.display='none';
window.openAuth=t=>{$('aModal').style.display='flex';swAuth(t)};
window.swAuth=t=>{const I=t==='login';$('t-in').classList.toggle('active',I);$('t-up').classList.toggle('active',!I);$('f-in').style.display=I?'block':'none';$('f-up').style.display=I?'none':'block'};
window.doAuth=async(e,I)=>{
  e.preventDefault();
  try{
    if(I){await signInWithEmailAndPassword(auth,$('in-mail').value,$('in-pass').value);toast('เข้าสู่ระบบสำเร็จ!')}
    else{const r=await createUserWithEmailAndPassword(auth,$('up-mail').value,$('up-pass').value),n=$('up-name').value.trim();await updateProfile(r.user,{displayName:n});await setDoc(doc(db,"users",r.user.uid),{username:n,favs});toast('สมัครสมาชิกสำเร็จ!')}
    closeM('aModal');
  }catch(err){toast({'auth/invalid-credential':'อีเมลหรือรหัสผ่านไม่ถูกต้อง','auth/email-already-in-use':'อีเมลนี้ถูกใช้งานแล้ว','auth/weak-password':'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'}[err.code]||'เกิดข้อผิดพลาด: '+err.message)}
};
window.out=async()=>{await signOut(auth);toast('ออกจากระบบแล้ว')};
window.copyLink=()=>navigator.clipboard.writeText(location.href).then(()=>toast('คัดลอกลิงก์สำเร็จ!'));
window.toast=m=>{$('t-msg').innerText=m;$('toast').style.display='flex';setTimeout(()=>$('toast').style.display='none',2800)};

onAuthStateChanged(auth,async u=>{
  curUser=u;
  if(u){
    $('auth-box').innerHTML=`<span style="color:var(--neon);font-weight:700;margin-right:6px"><i class="fa-solid fa-user-check"></i> ${u.displayName||u.email.split('@')[0]}</span><button class="btn" onclick="out()"><i class="fa-solid fa-right-from-bracket"></i></button>`;
    const s=await getDoc(doc(db,"users",u.uid)).catch(console.error);if(s?.exists()&&s.data().favs)favs=s.data().favs;
  }else{$('auth-box').innerHTML=`<button class="btn-s" onclick="openAuth('login')"><i class="fa-solid fa-right-to-bracket"></i> <span class="hide-m">เข้าสู่ระบบ</span></button>`;favs=JSON.parse(localStorage.getItem('mt_fav')||'[]')}
  render();
});
render();
</script>
</body>
