<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT GameZone - 10 อันดับเกมยอดนิยม PC & Mobile</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#090a0f;--card:#12151e;--nav:#0d1017;--neon:#00ff66;--glow:rgba(0,255,102,.4);--txt:#e0e6ed;--mut:#8a96a3;--bd:rgba(0,255,102,.2)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Kanit',sans-serif;scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);padding-bottom:70px;overflow-x:hidden}
.toast{position:fixed;top:20px;right:20px;background:var(--card);border:2px solid var(--neon);color:#fff;padding:12px 24px;border-radius:8px;box-shadow:0 0 15px var(--glow);z-index:9999;display:none;align-items:center;gap:10px}
header{background:rgba(13,16,23,.95);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:1000;backdrop-filter:blur(10px)}
.nav,.container{max-width:1000px;margin:0 auto;padding:10px 20px}
.nav{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo img{height:44px;border-radius:8px;border:1px solid var(--neon);box-shadow:0 0 10px var(--glow)}
.logo-txt{font-family:'Orbitron',sans-serif;font-size:1.35rem;font-weight:900;background:linear-gradient(135deg,#fff,#a1a8b8,#636e7b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-txt span{color:var(--neon);-webkit-text-fill-color:var(--neon)}
.actions{display:flex;align-items:center;gap:10px}
.btn,.btn-solid{padding:8px 15px;border-radius:6px;cursor:pointer;font-weight:600;transition:.3s;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:.9rem;border:1px solid var(--neon)}
.btn{background:transparent;color:var(--neon)}.btn:hover{background:var(--neon);color:#000;box-shadow:0 0 15px var(--glow)}
.btn-solid{background:var(--neon);color:#000}.btn-solid:hover{box-shadow:0 0 20px var(--glow);transform:translateY(-2px)}
.hero{display:flex;justify-content:center;margin:10px 0 28px;padding:20px;background:radial-gradient(circle,rgba(0,255,102,.12),rgba(18,21,30,.8) 70%);border-radius:16px;border:1px solid var(--bd);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.hero img{max-width:320px;width:100%;border-radius:14px;box-shadow:0 0 25px var(--glow);border:1px solid rgba(0,255,102,.4)}
.title{font-size:1.4rem;margin-bottom:16px;display:flex;align-items:center;gap:10px;border-left:4px solid var(--neon);padding-left:12px}
.tabs{display:flex;gap:12px;margin-bottom:20px;background:var(--card);padding:8px;border-radius:12px;border:1px solid var(--bd)}
.tab-btn{flex:1;padding:11px;border:none;background:transparent;color:var(--mut);font-size:1rem;font-weight:600;border-radius:8px;cursor:pointer;transition:.3s;display:flex;align-items:center;justify-content:center;gap:8px}
.tab-btn.active{background:var(--neon);color:#000;box-shadow:0 0 15px var(--glow)}
.list{display:flex;flex-direction:column;gap:12px;margin-bottom:40px}
.row{background:var(--card);border-radius:12px;padding:13px 16px;border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:15px;cursor:pointer;transition:.25s}
.row:hover{transform:translateX(6px);border-color:var(--neon);background:#161b26;box-shadow:0 4px 15px var(--glow)}
.rank{font-family:'Orbitron',sans-serif;font-size:1.2rem;font-weight:900;width:30px;text-align:center;color:var(--mut);flex-shrink:0}
.r1{color:#ffd700;font-size:1.4rem}.r2{color:#e0e0e0;font-size:1.35rem}.r3{color:#cd7f32;font-size:1.3rem}
.icon-box{width:64px;height:64px;border-radius:15px;overflow:hidden;background:#000;border:1px solid rgba(255,255,255,.12);flex-shrink:0}
.icon-box img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}
.g-title{font-size:1.08rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-sub{font-size:.86rem;color:var(--mut);margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-stat{display:flex;gap:14px;font-size:.84rem}.star{color:#fc0;font-weight:600}
.pill{background:rgba(0,255,102,.12);color:var(--neon);border:1px solid var(--neon);padding:7px 16px;border-radius:20px;font-size:.86rem;font-weight:600;text-decoration:none;transition:.25s;white-space:nowrap}
.row:hover .pill,.pill:hover{background:var(--neon);color:#000}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;justify-content:center;align-items:center;backdrop-filter:blur(8px);padding:20px}
.m-box{background:var(--card);border:1px solid var(--neon);border-radius:12px;padding:25px;width:100%;max-width:480px;position:relative;box-shadow:0 0 30px var(--glow);max-height:90vh;overflow-y:auto;text-align:center}
.close{position:absolute;top:15px;right:15px;color:var(--mut);cursor:pointer;font-size:1.5rem}
.m-logo{width:105px;height:105px;border-radius:20px;object-fit:cover;border:2px solid var(--neon);margin:0 auto 14px;display:block}
.a-tabs{display:flex;gap:10px;margin-bottom:20px;border-bottom:1px solid #333}
.a-tab{padding:10px 18px;cursor:pointer;color:var(--mut);font-weight:600}
.a-tab.active{color:var(--neon);border-bottom:2px solid var(--neon)}
.fg{margin-bottom:14px;text-align:left}.fg label{display:block;margin-bottom:5px;font-size:.9rem}
.fc{width:100%;padding:11px;background:#000;border:1px solid #333;border-radius:6px;color:#fff;font-size:1rem}.fc:focus{outline:none;border-color:var(--neon)}
.b-nav{display:none;position:fixed;bottom:0;left:0;width:100%;background:var(--nav);border-top:1px solid var(--bd);z-index:1000;padding:8px 0;justify-content:space-around}
.b-item{color:var(--mut);text-decoration:none;display:flex;flex-direction:column;align-items:center;font-size:.75rem;gap:4px}.b-item.active{color:var(--neon)}

</style>
</head>

<div id="toast" class="toast"><i class="fa-solid fa-circle-check" style="color:var(--neon)"></i><span id="t-msg"></span></div>

<header>
  <div class="nav">

  </div>
</header>

<div class="container">
  <div class="hero"><img src="Neon MT GameZone Esports Emblem.png" alt="MT GameZone"></div>
  <div class="title"><i class="fa-solid fa-trophy" style="color:var(--neon)"></i> 10 อันดับเกมยอดนิยม</div>
  <div class="tabs">
    <button class="tab-btn active" id="b-mob" onclick="setPlat('mob')"><i class="fa-solid fa-mobile-screen-button"></i> Mobile Games</button>
    <button class="tab-btn" id="b-pc" onclick="setPlat('pc')"><i class="fa-solid fa-desktop"></i> PC Games</button>
  </div>
  <div class="list" id="gameList"></div>
</div>

<div class="b-nav">
  <a href="#" class="b-item active"><i class="fa-solid fa-house"></i>หน้าแรก</a>
  <a href="#gameList" class="b-item" onclick="setPlat('mob')"><i class="fa-solid fa-mobile-screen"></i>Mobile</a>
  <a href="#gameList" class="b-item" onclick="setPlat('pc')"><i class="fa-solid fa-desktop"></i>PC</a>
  <a href="#" class="b-item" onclick="openAuth('login')"><i class="fa-solid fa-user"></i>บัญชี</a>
</div>

<div class="modal" id="gModal">
  <div class="m-box">
    <i class="fa-solid fa-xmark close" onclick="closeM('gModal')"></i>
    <img id="m-img" class="m-logo">
    <h2 id="m-title" style="color:var(--neon);margin-bottom:6px"></h2>
    <div style="display:flex;justify-content:center;gap:15px;font-size:.9rem;color:var(--mut);margin-bottom:14px">
      <span id="m-pub"></span><span id="m-rat" style="color:#fc0"></span><span id="m-sz"></span>
    </div>
    <p id="m-desc" style="line-height:1.6;color:#ccc;margin-bottom:20px;text-align:left"></p>
    <a id="m-dl" target="_blank" class="btn-solid" style="width:100%;font-size:1.05rem"></a>
  </div>
</div>

<div class="modal" id="aModal">
  <div class="m-box">
    <i class="fa-solid fa-xmark close" onclick="closeM('aModal')"></i>
    <div class="a-tabs">
      <div class="a-tab active" id="t-in" onclick="swAuth('login')">เข้าสู่ระบบ</div>
      <div class="a-tab" id="t-up" onclick="swAuth('reg')">สมัครสมาชิก</div>
    </div>
    <form id="f-in" onsubmit="doAuth(event,1)">
      <div class="fg"><label>อีเมล</label><input type="email" class="fc" placeholder="example@mail.com" required></div>
      <div class="fg"><label>รหัสผ่าน</label><input type="password" class="fc" placeholder="••••••••" required></div>
      <button type="submit" class="btn-solid" style="width:100%">เข้าสู่ระบบ</button>
    </form>
    <form id="f-up" style="display:none" onsubmit="doAuth(event,0)">
      <div class="fg"><label>ชื่อผู้ใช้งาน</label><input type="text" class="fc" placeholder="Gamer123" required></div>
      <div class="fg"><label>อีเมล</label><input type="email" class="fc" placeholder="example@mail.com" required></div>
      <div class="fg"><label>รหัสผ่าน</label><input type="password" class="fc" placeholder="••••••••" required></div>
      <button type="submit" class="btn-solid" style="width:100%">สมัครสมาชิก</button>
    </form>
  </div>
</div>

let cur='mob';
function setPlat(t){
  cur=t;
  $('b-mob').classList.toggle('active',t==='mob');
  $('b-pc').classList.toggle('active',t==='pc');
  $('gameList').innerHTML=data[t].map((g,i)=>`
    <div class="row" onclick="openG(${i})">
      <div class="rank ${i<3?'r'+(i+1):''}">${i+1}</div>
      <div class="icon-box"><img src="${g[4]}" alt="${g[0]}"></div>
      <div class="info">
        <div class="g-title">${g[0]}</div>
        <div class="g-sub">${g[1]}</div>
        <div class="g-stat"><span class="star">${g[2]} <i class="fa-solid fa-star"></i></span><span><i class="fa-solid fa-hard-drive"></i> ${g[3]}</span></div>
      </div>
      <a href="${g[6]}" target="_blank" class="pill" onclick="event.stopPropagation()"><i class="fa-solid fa-download"></i> ติดตั้ง</a>
    </div>`).join('');
}
function openG(i){
  const g=data[cur][i];
  $('m-img').src=g[4];$('m-title').innerText=`#${i+1} ${g[0]}`;
  $('m-pub').innerHTML=`<i class="fa-solid fa-building"></i> ${g[1]}`;
  $('m-rat').innerHTML=`<i class="fa-solid fa-star"></i> ${g[2]}`;
  $('m-sz').innerHTML=`<i class="fa-solid fa-hard-drive"></i> ${g[3]}`;
  $('m-desc').innerText=g[5];$('m-dl').href=g[6];
  $('m-dl').innerHTML=`<i class="${g[7]}"></i> ${g[8]}`;
  $('gModal').style.display='flex';
}
const closeM=id=>$(id).style.display='none',
openAuth=t=>{$('aModal').style.display='flex';swAuth(t)},
swAuth=t=>{
  const isIn=t==='login';
  $('t-in').classList.toggle('active',isIn);$('t-up').classList.toggle('active',!isIn);
  $('f-in').style.display=isIn?'block':'none';$('f-up').style.display=isIn?'none':'block';
},
doAuth=(e,isIn)=>{
  e.preventDefault();toast(isIn?'เข้าสู่ระบบสำเร็จ!':'สมัครสมาชิกสำเร็จ!');closeM('aModal');
  $('auth-box').innerHTML=`<span style="color:var(--neon);font-weight:700;margin-right:8px"><i class="fa-solid fa-user-check"></i> Gamer</span><button class="btn" onclick="out()"><i class="fa-solid fa-right-from-bracket"></i></button>`;
},
out=()=>{toast('ออกจากระบบแล้ว');$('auth-box').innerHTML=`<button class="btn-solid" onclick="openAuth('login')"><i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ</button>`},
copyLink=()=>navigator.clipboard.writeText('https://mtgamezone.netlify.app').then(()=>toast('คัดลอกลิงก์สำเร็จ!')),
toast=m=>{$('t-msg').innerText=m;$('toast').style.display='flex';setTimeout(()=>$('toast').style.display='none',2800)};
setPlat('mob');
</script>
