<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT GameZone - ศูนย์รวมข้อมูลและ 10 อันดับเกมยอดนิยม PC & Mobile</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090a0f;
            --bg-card: #12151e;
            --bg-nav: #0d1017;
            --neon-green: #00ff66;
            --neon-green-glow: rgba(0, 255, 102, 0.4);
            --text-silver: #e0e6ed;
            --text-muted: #8a96a3;
            --silver-metal: linear-gradient(135deg, #ffffff 0%, #a1a8b8 50%, #636e7b 100%);
            --border-color: rgba(0, 255, 102, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; scroll-behavior: smooth; }
        body { background-color: var(--bg-dark); color: var(--text-silver); padding-bottom: 70px; overflow-x: hidden; }

        /* Toast Alert */
        .toast {
            position: fixed; top: 20px; right: 20px; background: var(--bg-card);
            border: 2px solid var(--neon-green); color: #fff; padding: 12px 24px;
            border-radius: 8px; box-shadow: 0 0 15px var(--neon-green-glow);
            z-index: 9999; display: none; align-items: center; gap: 10px;
        }

        /* Header Navigation */
        header {
            background-color: rgba(13, 16, 23, 0.95); border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(10px);
        }
        .nav-container {
            max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between;
            align-items: center; padding: 12px 20px;
        }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-text {
            font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 900;
            background: var(--silver-metal); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .logo-text span { color: var(--neon-green); -webkit-text-fill-color: var(--neon-green); }

        .user-actions { display: flex; align-items: center; gap: 12px; }

        .btn-neon {
            background: transparent; color: var(--neon-green); border: 1px solid var(--neon-green);
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s;
            display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
        }
        .btn-neon:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 15px var(--neon-green-glow); }

        .btn-neon-solid {
            background: var(--neon-green); color: #000; border: 1px solid var(--neon-green);
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
        }
        .btn-neon-solid:hover { box-shadow: 0 0 20px var(--neon-green-glow); transform: translateY(-2px); }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .section-title {
            font-size: 1.5rem; margin-bottom: 20px; display: flex; align-items: center;
            gap: 10px; border-left: 4px solid var(--neon-green); padding-left: 12px;
        }

        /* Platform Switcher Tabs */
        .platform-tabs {
            display: flex; gap: 15px; margin-bottom: 25px; background: var(--bg-card);
            padding: 8px; border-radius: 12px; border: 1px solid var(--border-color);
        }
        .platform-btn {
            flex: 1; padding: 12px; border: none; background: transparent; color: var(--text-muted);
            font-size: 1.1rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .platform-btn.active {
            background: var(--neon-green); color: #000; box-shadow: 0 0 15px var(--neon-green-glow);
        }

        /* Top 10 Game Grid */
        .game-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px; margin-bottom: 40px;
        }
        .game-card {
            background: var(--bg-card); border-radius: 10px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; position: relative; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; padding-top: 15px;
        }
        .game-card:hover {
            transform: translateY(-5px); border-color: var(--neon-green);
            box-shadow: 0 5px 15px var(--neon-green-glow);
        }
        .rank-badge {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.85);
            color: var(--neon-green); font-family: 'Orbitron', sans-serif; font-size: 1.1rem;
            font-weight: 900; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--neon-green);
            z-index: 2;
        }
        .rank-1 { background: #ffd700; color: #000; border-color: #ffd700; }
        .rank-2 { background: #c0c0c0; color: #000; border-color: #c0c0c0; }
        .rank-3 { background: #cd7f32; color: #000; border-color: #cd7f32; }

        .game-logo-wrapper {
            width: 100px; height: 100px; border-radius: 20px; overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1); background: #000;
            display: flex; align-items: center; justify-content: center; margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .game-img { width: 100%; height: 100%; object-fit: cover; }
        .game-info { padding: 15px 12px; width: 100%; text-align: center; }
        .game-title { font-size: 1rem; font-weight: 600; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .game-meta { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); }
        .rating { color: #ffcc00; }

        /* Modal Base */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center;
            backdrop-filter: blur(8px); padding: 20px;
        }
        .modal-content {
            background: var(--bg-card); border: 1px solid var(--neon-green); border-radius: 12px;
            padding: 25px; width: 100%; max-width: 500px; position: relative;
            box-shadow: 0 0 30px var(--neon-green-glow); max-height: 90vh; overflow-y: auto; text-align: center;
        }
        .close-btn { position: absolute; top: 15px; right: 15px; color: var(--text-muted); cursor: pointer; font-size: 1.5rem; }

        .modal-logo {
            width: 110px; height: 110px; border-radius: 22px; object-fit: cover;
            border: 2px solid var(--neon-green); margin: 0 auto 15px auto; display: block;
            box-shadow: 0 0 15px var(--neon-green-glow);
        }

        /* Auth Form Styles */
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #333; text-align: left; }
        .auth-tab { padding: 10px 20px; cursor: pointer; color: var(--text-muted); font-weight: 600; font-size: 1.1rem; }
        .auth-tab.active { color: var(--neon-green); border-bottom: 2px solid var(--neon-green); }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--text-silver); }
        .form-control {
            width: 100%; padding: 12px; background: #000; border: 1px solid #333;
            border-radius: 6px; color: #fff; font-size: 1rem;
        }
        .form-control:focus { outline: none; border-color: var(--neon-green); }

        /* Mobile Bottom Nav */
        .mobile-bottom-nav {
            display: none; position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--bg-nav); border-top: 1px solid var(--border-color);
            z-index: 1000; padding: 8px 0; justify-content: space-around;
        }
        .mobile-nav-item {
            color: var(--text-muted); text-decoration: none; display: flex;
            flex-direction: column; align-items: center; font-size: 0.75rem; gap: 4px;
        }
        .mobile-nav-item.active { color: var(--neon-green); }

        @media (max-width: 768px) {
            .game-grid { grid-template-columns: repeat(2, 1fr); }
            .platform-btn { font-size: 0.95rem; }
            .mobile-bottom-nav { display: flex; }
        }
    </style>
</head>
<body>

    <div id="toast" class="toast">
        <i class="fa-solid fa-circle-check" style="color: var(--neon-green)"></i>
        <span id="toast-msg">แจ้งเตือน</span>
    </div>

                <i class="fa-solid fa-gamepad fa-2x" style="color: var(--neon-green)"></i>
                <div class="logo-text">MT <span>GAMEZONE</span></div>
            </a>
            
            <div class="user-actions">
                <button class="btn-neon" onclick="copyLink()"><i class="fa-solid fa-share-nodes"></i> แชร์เว็บ</button>
                <div id="auth-buttons">
                    <button class="btn-neon-solid" onclick="openAuthModal('login')"><i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ</button>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        
        <!-- Platform Switcher -->
        <div class="section-title"><i class="fa-solid fa-trophy" style="color: var(--neon-green)"></i> 10 อันดับเกมยอดนิยม</div>
        
        <div class="platform-tabs">
            <button class="platform-btn active" id="btn-mobile" onclick="switchPlatform('mobile')">
                <i class="fa-solid fa-mobile-screen-button"></i> Mobile Games (Play Store)
            </button>
            <button class="platform-btn" id="btn-pc" onclick="switchPlatform('pc')">
                <i class="fa-solid fa-desktop"></i> PC Games (Official Stores)
            </button>
        </div>

        <!-- Games Grid -->
        <div class="game-grid" id="topGameGrid"></div>

    </div>

    <!-- Mobile Bottom Navigation -->
    <div class="mobile-bottom-nav">
        <a href="#" class="mobile-nav-item active"><i class="fa-solid fa-house"></i>หน้าแรก</a>
        <a href="#" class="mobile-nav-item" onclick="switchPlatform('mobile')"><i class="fa-solid fa-mobile-screen"></i>Mobile</a>
        <a href="#" class="mobile-nav-item" onclick="switchPlatform('pc')"><i class="fa-solid fa-desktop"></i>PC</a>
        <a href="#" class="mobile-nav-item" onclick="openAuthModal('login')"><i class="fa-solid fa-user"></i>บัญชี</a>
    </div>

    <!-- Game Detail Modal -->
    <div class="modal" id="gameModal">
        <div class="modal-content">
            <i class="fa-solid fa-xmark close-btn" onclick="closeModal('gameModal')"></i>
            <img id="m-img" src="" class="modal-logo">
            <h2 id="m-title" style="color: var(--neon-green); margin-bottom: 5px;"></h2>
            <div style="display: flex; justify-content: center; gap: 15px; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 15px;">
                <span id="m-publisher"><i class="fa-solid fa-building"></i> </span>
                <span id="m-rating" style="color: #ffcc00;"><i class="fa-solid fa-star"></i> </span>
                <span id="m-size"><i class="fa-solid fa-hard-drive"></i> </span>
            </div>
            <p id="m-desc" style="line-height: 1.6; color: #ccc; margin-bottom: 20px; text-align: left;"></p>
            <a id="m-download-btn" href="#" target="_blank" class="btn-neon-solid" style="width: 100%; font-size: 1.05rem;">
                <i class="fa-solid fa-download"></i> ดาวน์โหลด / เล่นเกมนี้
            </a>
        </div>
    </div>

    <!-- Login / Register Modal -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <i class="fa-solid fa-xmark close-btn" onclick="closeModal('authModal')"></i>
            
            <div class="auth-tabs">
                <div class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">เข้าสู่ระบบ</div>
                <div class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">สมัครสมาชิก</div>
            </div>

            <!-- Login Form -->
            <form id="form-login" onsubmit="handleAuth(event, 'login')">
                <div class="form-group">
                    <label>อีเมล (Email)</label>
                    <input type="email" class="form-control" placeholder="example@mail.com" required>
                </div>
                <div class="form-group">
                    <label>รหัสผ่าน (Password)</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 20px;">
                    <label style="cursor: pointer;"><input type="checkbox"> จดจำฉันไว้</label>
                    <a href="#" style="color: var(--neon-green); text-decoration: none;" onclick="showToast('ลิงก์รีเซ็ตรหัสผ่านถูกส่งไปยังอีเมลของคุณแล้ว')">ลืมรหัสผ่าน?</a>
                </div>
                <button type="submit" class="btn-neon-solid" style="width: 100%; font-size: 1.05rem;">เข้าสู่ระบบ</button>
            </form>

            <!-- Register Form -->
            <form id="form-register" style="display: none;" onsubmit="handleAuth(event, 'register')">
                <div class="form-group">
                    <label>ชื่อผู้ใช้งาน (Username)</label>
                    <input type="text" class="form-control" placeholder="Gamer123" required>
                </div>
                <div class="form-group">
                    <label>อีเมล (Email)</label>
                    <input type="email" class="form-control" placeholder="example@mail.com" required>
                </div>
                <div class="form-group">
                    <label>รหัสผ่าน (Password)</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-neon-solid" style="width: 100%; font-size: 1.05rem;">สมัครสมาชิก</button>
            </form>
        </div>
    </div>

        function renderTopGames(data) {
            const grid = document.getElementById('topGameGrid');
            grid.innerHTML = data.map(game => {
                let rankClass = game.rank <= 3 ? `rank-${game.rank}` : '';
                return `
                    <div class="game-card" onclick='openModal("gameModal", ${JSON.stringify(game)})'>
                        <div class="rank-badge ${rankClass}">#${game.rank}</div>
                        <div class="game-logo-wrapper">
                            <img src="${game.img}" class="game-img" alt="${game.title}">
                        </div>
                        <div class="game-info">
                            <div class="game-title">${game.title}</div>
                            <div class="game-meta">
                                <span>${game.publisher}</span>
                                <span class="rating"><i class="fa-solid fa-star"></i> ${game.rating}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function switchPlatform(type) {
            document.getElementById('btn-mobile').classList.toggle('active', type === 'mobile');
            document.getElementById('btn-pc').classList.toggle('active', type === 'pc');
            renderTopGames(type === 'mobile' ? mobileGames : pcGames);
        }

        function openModal(modalId, game = null) {
            if(game) {
                document.getElementById('m-img').src = game.img;
                document.getElementById('m-title').innerText = `#${game.rank} ${game.title}`;
                document.getElementById('m-publisher').innerHTML = `<i class="fa-solid fa-building"></i> ${game.publisher}`;
                document.getElementById('m-rating').innerHTML = `<i class="fa-solid fa-star"></i> ${game.rating}`;
                document.getElementById('m-size').innerHTML = `<i class="fa-solid fa-hard-drive"></i> ${game.size}`;
                document.getElementById('m-desc').innerText = game.desc;

                const dlBtn = document.getElementById('m-download-btn');
                dlBtn.href = game.downloadUrl;
                dlBtn.innerHTML = `<i class="${game.icon}"></i> ${game.btnText}`;
            }
            document.getElementById(modalId).style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function openAuthModal(type) {
            openModal('authModal');
            switchAuthTab(type);
        }

        function switchAuthTab(type) {
            if(type === 'login') {
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('tab-register').classList.remove('active');
                document.getElementById('form-login').style.display = 'block';
                document.getElementById('form-register').style.display = 'none';
            } else {
                document.getElementById('tab-register').classList.add('active');
                document.getElementById('tab-login').classList.remove('active');
                document.getElementById('form-register').style.display = 'block';
                document.getElementById('form-login').style.display = 'none';
            }
        }

        function handleAuth(e, type) {
            e.preventDefault();
            showToast(type === 'login' ? "เข้าสู่ระบบสำเร็จแล้ว!" : "สมัครสมาชิกสำเร็จแล้ว!");
            closeModal('authModal');
            document.getElementById('auth-buttons').innerHTML = `
                <span style="color: var(--neon-green); font-weight: bold; margin-right: 8px;">
                    <i class="fa-solid fa-user-check"></i> ผู้ใช้งาน (Gamer)
                </span>
                <button class="btn-neon" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
            `;
        }

        function logout() {
            showToast("ออกจากระบบแล้ว");
            document.getElementById('auth-buttons').innerHTML = `
                <button class="btn-neon-solid" onclick="openAuthModal('login')"><i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ</button>
            `;
        }

        function copyLink() {
            navigator.clipboard.writeText("https://mtgamezone.netlify.app").then(() => {
                showToast("คัดลอกลิงก์สำเร็จแล้ว!");
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.style.display = 'flex';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        renderTopGames(mobileGames);
    </script>
